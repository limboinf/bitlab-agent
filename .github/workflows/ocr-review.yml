# AI code review via open-code-review (https://github.com/alibaba/open-code-review)
#
# Triggers:
#   - PR opened/synchronize/reopened: automatic review
#   - Comment "/open-code-review" or "@open-code-review" on a PR: manual re-review
#     (restricted to MEMBER/OWNER/COLLABORATOR so only repo members spend LLM quota)
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   secret    OCR_LLM_URL            https://open.bigmodel.cn/api/coding/paas/v4 (GLM Coding Plan, OpenAI-compatible)
#   secret    OCR_LLM_AUTH_TOKEN     GLM Coding Plan API key
#   variable  OCR_LLM_MODEL          glm-5.3
#   variable  OCR_LLM_USE_ANTHROPIC  false
name: OpenCodeReview PR Review

# Actions evaluates concurrency BEFORE job-level if-conditions, so a flat group
# would let any unrelated PR comment cancel a running review. Matching events
# (PR events + trigger comments) share a per-PR group; everything else lands in
# a unique noop group and is skipped without touching real reviews.
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # pull_request_target (not pull_request) so secrets are available for fork
  # PRs too; safe because the action only reads the diff and never executes
  # code from the PR.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Mirror of the concurrency condition: PR events, or human-authored
    # trigger comments from repo members. Bot exclusion is a safety net for
    # PAT/App tokens, which do not suppress bot comment events like GITHUB_TOKEN does.
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            // issue_comment events have no top-level pull_request fields, so
            // resolve the PR base/head here for the action to review the right diff.
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@v1.9.9
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          # For issue_comment triggers, pass the resolved refs; for
          # pull_request_target the action resolves them from the event.
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
