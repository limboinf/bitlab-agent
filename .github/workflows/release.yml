name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build as a release candidate, for example v0.2.0"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CANDIDATE_NAME: release-candidate-${{ inputs.tag || github.ref_name }}-${{ github.sha }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify version and changelog
        run: bun run release:check "${RELEASE_TAG}"

  verify:
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # setup-uv stopped publishing floating major tags in v8, so this is pinned
      # to an exact release rather than a tracking `@v10`.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # The document tools declare their dependencies with PEP 723 inline
          # metadata, so the default lockfile globs match no file and the cache
          # key never changes. Key it on the scripts that carry the deps.
          cache-dependency-glob: "apps/electron/resources/scripts/*.py"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Validate types, focused tests, document tools, and locales
        run: bun run validate:ci
      - name: Audit brand strings in shipped source
        run: bun run audit:brand
      - name: Lint
        run: bun run lint
      - name: Run test suite
        run: bun run test

  release-policy:
    if: github.event_name == 'workflow_dispatch'
    name: Resolve optional signing policy
    runs-on: ubuntu-latest
    environment: release
    outputs:
      mac_signing: ${{ steps.signing.outputs.mac_signing }}
      windows_signing: ${{ steps.signing.outputs.windows_signing }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
      APPLE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WIN_CSC_LINK }}
      WINDOWS_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Validate optional signing credentials
        id: signing
        shell: bash
        run: |
          apple_names=(APPLE_CERTIFICATE APPLE_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID)
          windows_names=(WINDOWS_CERTIFICATE WINDOWS_PASSWORD)

          apple_count=0
          for name in "${apple_names[@]}"; do
            if [ -n "${!name}" ]; then apple_count=$((apple_count + 1)); fi
          done
          windows_count=0
          for name in "${windows_names[@]}"; do
            if [ -n "${!name}" ]; then windows_count=$((windows_count + 1)); fi
          done

          if [ "$apple_count" -ne 0 ] && [ "$apple_count" -ne "${#apple_names[@]}" ]; then
            echo "::error::Apple signing is partially configured. Set all Apple release secrets or remove all of them for an unsigned release."
            exit 1
          fi
          if [ "$windows_count" -ne 0 ] && [ "$windows_count" -ne "${#windows_names[@]}" ]; then
            echo "::error::Windows signing is partially configured. Set both Windows release secrets or remove both for an unsigned release."
            exit 1
          fi

          if [ "$apple_count" -eq "${#apple_names[@]}" ]; then
            echo "mac_signing=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing and notarization enabled"
          else
            echo "mac_signing=false" >> "$GITHUB_OUTPUT"
            echo "Apple credentials absent; macOS artifacts will use ad-hoc signing and manual updates"
          fi

          if [ "$windows_count" -eq "${#windows_names[@]}" ]; then
            echo "windows_signing=true" >> "$GITHUB_OUTPUT"
            echo "Windows Authenticode signing enabled"
          else
            echo "windows_signing=false" >> "$GITHUB_OUTPUT"
            echo "Windows credentials absent; Windows artifacts will be unsigned"
          fi

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: [preflight, release-policy]
    environment: release
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            platform: darwin
            arch: arm64
            bun_cache: ~/.bun/install/cache
            electron_cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - os: macos-15-intel
            target: mac
            platform: darwin
            arch: x64
            bun_cache: ~/.bun/install/cache
            electron_cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - os: windows-latest
            target: win
            platform: win32
            arch: x64
            bun_cache: ~\.bun
            electron_cache: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
          - os: ubuntu-latest
            target: linux
            platform: linux
            arch: x64
            bun_cache: ~/.bun/install/cache
            electron_cache: |
              ~/.cache/electron
              ~/.cache/electron-builder
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # setup-uv stopped publishing floating major tags in v8, so this is pinned
      # to an exact release rather than a tracking `@v10`.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # The document tools declare their dependencies with PEP 723 inline
          # metadata, so the default lockfile globs match no file and the cache
          # key never changes. Key it on the scripts that carry the deps.
          cache-dependency-glob: "apps/electron/resources/scripts/*.py"
      - name: Restore Bun package cache
        uses: actions/cache@v6
        with:
          path: ${{ matrix.bun_cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Electron download cache
        uses: actions/cache@v6
        with:
          path: ${{ matrix.electron_cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('bun.lock', 'apps/electron/electron-builder.yml') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build desktop application
        env:
          BITLAB_AUTO_UPDATE_ENABLED: ${{ matrix.target != 'mac' || needs.release-policy.outputs.mac_signing == 'true' }}
        run: bun run electron:build
      - name: Package desktop
        working-directory: apps/electron
        env:
          MAC_SIGNING: ${{ needs.release-policy.outputs.mac_signing }}
          WINDOWS_SIGNING: ${{ needs.release-policy.outputs.windows_signing }}
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          args=(--config electron-builder.yml --${{ matrix.target }} --${{ matrix.arch }} --publish never)
          if [ "${{ matrix.target }}" = "mac" ]; then
            if [ "$MAC_SIGNING" = "true" ]; then
              export CSC_LINK="$MAC_CSC_LINK"
              export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
              export APPLE_ID="$MAC_APPLE_ID"
              export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD"
              export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
              args+=("-c.forceCodeSigning=true")
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              args+=("-c.mac.identity=-" "-c.mac.hardenedRuntime=false")
            fi
          elif [ "${{ matrix.target }}" = "win" ] && [ "$WINDOWS_SIGNING" = "true" ]; then
            export CSC_LINK="$WINDOWS_CSC_LINK"
            export CSC_KEY_PASSWORD="$WINDOWS_CSC_KEY_PASSWORD"
            args+=("-c.forceCodeSigning=true")
          fi
          bunx electron-builder "${args[@]}"
      - name: Verify macOS code signature
        if: matrix.target == 'mac'
        run: codesign --verify --deep --strict --verbose=2 "apps/electron/release/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/Bitlab.app"
      - name: Verify Windows Authenticode signature
        if: matrix.target == 'win' && needs.release-policy.outputs.windows_signing == 'true'
        shell: pwsh
        run: |
          $installers = Get-ChildItem "apps/electron/release/*.exe"
          if ($installers.Count -eq 0) { throw "No Windows installer found" }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($installer.Name): $($signature.Status)"
            }
          }
      - name: Build headless server
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          bun run scripts/build-server.ts --output="dist/Bitlab-server-${version}-${{ matrix.platform }}-${{ matrix.arch }}" --compress
      - name: Compress Windows headless server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$env:RELEASE_TAG".TrimStart("v")
          Compress-Archive -Path "dist/Bitlab-server-$version-${{ matrix.platform }}-${{ matrix.arch }}/*" -DestinationPath "dist/Bitlab-server-$version-${{ matrix.platform }}-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/*.exe
            apps/electron/release/*.AppImage
            apps/electron/release/*.blockmap
            apps/electron/release/latest*.yml
            dist/Bitlab-server-*.tar.gz
            dist/Bitlab-server-*.zip

  candidate:
    if: github.event_name == 'workflow_dispatch'
    needs: [verify, build, release-policy]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
      - name: Collect and verify release assets
        run: bun run scripts/collect-release-assets.ts artifacts release-assets "${RELEASE_TAG#v}"
      - name: Record installer trust status
        env:
          MAC_SIGNING: ${{ needs.release-policy.outputs.mac_signing }}
          WINDOWS_SIGNING: ${{ needs.release-policy.outputs.windows_signing }}
        shell: bash
        run: |
          if [ "$MAC_SIGNING" = "true" ]; then
            mac_status="Developer ID signed and notarized"
          else
            mac_status="Ad-hoc signed; Gatekeeper warning expected; manual updates required"
          fi
          if [ "$WINDOWS_SIGNING" = "true" ]; then
            windows_status="Authenticode signed"
          else
            windows_status="Unsigned; SmartScreen warning may appear"
          fi
          {
            echo "Bitlab release trust status"
            echo "macOS: $mac_status"
            echo "Windows: $windows_status"
            echo "Linux and headless server: verified by SHA256SUMS"
          } > release-assets/SIGNING_STATUS.txt
          shasum -a 256 release-assets/SIGNING_STATUS.txt | sed 's#release-assets/##' >> release-assets/SHA256SUMS
      - name: Bind candidate to this commit and workflow run
        run: |
          bun run scripts/release-candidate.ts create \
            release-assets "$RELEASE_TAG" "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "${{ needs.release-policy.outputs.mac_signing }}" \
            "${{ needs.release-policy.outputs.windows_signing }}"
      - name: Report candidate result
        shell: bash
        run: |
          {
            echo "## Release candidate $RELEASE_TAG"
            echo
            echo "Built and verified commit \`$GITHUB_SHA\`. Push an annotated $RELEASE_TAG tag at this exact commit to publish these assets without rebuilding."
            echo
            echo '```'
            cat release-assets/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload promotable release candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CANDIDATE_NAME }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  promote:
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Locate the exact release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          response="$(gh api --method GET "/repos/$RELEASE_REPOSITORY/actions/artifacts" \
            -f name="$CANDIDATE_NAME" -f per_page=100)"
          match="$(jq -c \
            --arg name "$CANDIDATE_NAME" \
            --arg sha "$GITHUB_SHA" \
            '[.artifacts[] | select(.name == $name and (.expired | not) and .workflow_run.head_sha == $sha)] | sort_by(.created_at) | last' \
            <<< "$response")"
          run_id="$(jq -r '.workflow_run.id // empty' <<< "$match")"
          if [ -z "$run_id" ]; then
            echo "::error::No verified candidate named $CANDIDATE_NAME exists for commit $GITHUB_SHA. Run the Release workflow for $RELEASE_TAG on this commit before tagging."
            exit 1
          fi
          source_run="$(gh api "/repos/$RELEASE_REPOSITORY/actions/runs/$run_id")"
          workflow_id="$(gh api "/repos/$RELEASE_REPOSITORY/actions/workflows/release.yml" --jq .id)"
          if ! jq -e \
            --arg sha "$GITHUB_SHA" \
            --argjson workflow_id "$workflow_id" \
            '.workflow_id == $workflow_id and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .head_sha == $sha' \
            <<< "$source_run" > /dev/null; then
            echo "::error::Candidate workflow run $run_id is not a successful Release workflow_dispatch for commit $GITHUB_SHA."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Promoting candidate from workflow run $run_id"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.CANDIDATE_NAME }}
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run_id }}
      - name: Verify candidate provenance and checksums
        run: |
          bun run scripts/release-candidate.ts verify \
            release-assets "$RELEASE_TAG" "$GITHUB_SHA" \
            "${{ steps.candidate.outputs.run_id }}"
      - name: Build release notes from candidate provenance
        shell: bash
        run: |
          release_notes="$RUNNER_TEMP/release-notes.md"
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\] - " { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { exit }
            found { print }
          ' CHANGELOG.md > "$release_notes"
          if [ ! -s "$release_notes" ]; then
            echo "::error::CHANGELOG.md has no content for $RELEASE_TAG"
            exit 1
          fi
          if [ "$(jq -r .macSigning release-assets/BUILD_PROVENANCE.json)" = "true" ]; then
            mac_status="Developer ID signed and notarized"
          else
            mac_status="Ad-hoc signed; Gatekeeper warning expected; update by downloading the next DMG manually"
          fi
          if [ "$(jq -r .windowsSigning release-assets/BUILD_PROVENANCE.json)" = "true" ]; then
            windows_status="Authenticode signed"
          else
            windows_status="Unsigned; SmartScreen warning may appear"
          fi
          {
            echo
            echo "## Installation trust"
            echo
            echo "- macOS: $mac_status."
            echo "- Windows: $windows_status."
            echo "- Verify downloads with \`SHA256SUMS\`; machine-readable details are in \`SIGNING_STATUS.txt\`."
          } >> "$release_notes"
      - name: Create draft release and upload candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          release_notes="$RUNNER_TEMP/release-notes.md"
          state="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$state" = "false" ]; then
            echo "::error::Release $RELEASE_TAG is already published and cannot be replaced"
            exit 1
          fi
          if [ -z "$state" ]; then
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --verify-tag --title "Bitlab $RELEASE_TAG" --notes-file "$release_notes" --draft
          else
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --title "Bitlab $RELEASE_TAG" --notes-file "$release_notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$RELEASE_REPOSITORY" --clobber
      - name: Publish release after successful upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false --latest
