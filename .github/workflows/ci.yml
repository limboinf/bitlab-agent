name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Audit brand strings in shipped source
        run: bun run audit:brand
      - name: Validate types, focused tests, document tools, and locales
        run: bun run validate:ci
      - name: Run test suite
        run: bun run test
      - name: Build WebUI
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run webui:build
      - name: Check whitespace errors
        run: git diff --check

  package:
    name: Package ${{ matrix.target }}-${{ matrix.arch }}
    needs: quality
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            platform: darwin
            arch: arm64
          - os: windows-latest
            target: win
            platform: win32
            arch: x64
          - os: ubuntu-latest
            target: linux
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build desktop application
        env:
          BITLAB_AUTO_UPDATE_ENABLED: ${{ matrix.target != 'mac' }}
        run: bun run electron:build
      - name: Package desktop application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        working-directory: apps/electron
        shell: bash
        run: |
          args=(--config electron-builder.yml --${{ matrix.target }} --${{ matrix.arch }} --publish never)
          if [ "${{ matrix.target }}" = "mac" ]; then
            args+=("-c.mac.identity=-" "-c.mac.hardenedRuntime=false")
          fi
          bunx electron-builder "${args[@]}"
      - name: Build headless server
        shell: bash
        run: bun run scripts/build-server.ts --output="dist/Bitlab-server-ci-${{ matrix.platform }}-${{ matrix.arch }}" --compress
      - name: Compress Windows headless server
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Bitlab-server-ci-${{ matrix.platform }}-${{ matrix.arch }}/*" -DestinationPath "dist/Bitlab-server-ci-${{ matrix.platform }}-${{ matrix.arch }}.zip"
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ matrix.target }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/*.exe
            apps/electron/release/*.AppImage
            apps/electron/release/*.blockmap
            apps/electron/release/latest*.yml
            dist/Bitlab-server-*.tar.gz
            dist/Bitlab-server-*.zip
